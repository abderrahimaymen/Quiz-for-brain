name: brain_spark_quiz
description: A quiz app with multiple categories and features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  csv: ^5.1.1
  audioplayers: ^5.2.1
  cupertino_icons: ^1.0.2
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.csv
    - assets/audio/correct.mp3
    - assets/audio/incorrect.mp3
  
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
